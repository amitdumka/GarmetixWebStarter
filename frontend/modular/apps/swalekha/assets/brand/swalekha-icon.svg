<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="55%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#120821"/>
    </linearGradient>
    <radialGradient id="glow" cx="26%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="45%" stop-color="#F4C24E"/>
      <stop offset="100%" stop-color="#D89A2C"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DCD3F7"/>
      <stop offset="100%" stop-color="#F1ECFC"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="111" ry="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>

  <!-- open ledger -->
  <g>
    <path d="M256 168
             C 222 178, 176 176, 146 190
             C 138 194, 133 202, 133 211
             L 133 336
             C 133 347, 143 355, 154 352
             C 186 344, 224 345, 256 360
             Z" fill="url(#pageLeft)"/>
    <path d="M256 168
             C 290 178, 336 176, 366 190
             C 374 194, 379 202, 379 211
             L 379 336
             C 379 347, 369 355, 358 352
             C 326 344, 288 345, 256 360
             Z" fill="#FFFFFF"/>
    <rect x="253" y="172" width="6" height="184" rx="3" fill="#B9ACE0" opacity="0.55"/>

    <line x1="160" y1="222" x2="223" y2="216" stroke="#B9ACE0" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    <line x1="160" y1="248" x2="223" y2="243" stroke="#B9ACE0" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    <line x1="160" y1="274" x2="210" y2="270" stroke="#B9ACE0" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

    <line x1="352" y1="222" x2="289" y2="216" stroke="#D8CFEF" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    <line x1="352" y1="248" x2="289" y2="243" stroke="#D8CFEF" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    <line x1="352" y1="274" x2="302" y2="270" stroke="#D8CFEF" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- rupee coin -->
  <ellipse cx="256" cy="332" rx="60" ry="14" fill="#000000" opacity="0.20"/>
  <circle cx="256" cy="256" r="76" fill="url(#coinGrad)" stroke="#B57A1E" stroke-width="5"/>
  <circle cx="256" cy="256" r="63" fill="none" stroke="#B57A1E" stroke-width="2.5" opacity="0.55"/>
  <text x="256" y="286" font-family="DejaVu Sans, Noto Sans, Arial" font-size="92" font-weight="bold"
        fill="#4A2E06" text-anchor="middle">&#8377;</text>
</svg>