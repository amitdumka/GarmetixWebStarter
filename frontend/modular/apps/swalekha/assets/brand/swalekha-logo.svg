    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="45%" stop-color="#F4C24E"/>
      <stop offset="100%" stop-color="#D89A2C"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0" y1="0" x2="1" y2="0">
