<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="980" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B1D73"/>
      <stop offset="55%" stop-color="#241155"/>
      <stop offset="100%" stop-color="#120821"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="55%" stop-color="#2E1065"/>
      <stop offset="100%" stop-color="#120821"/>
