  <!-- wordmark -->
  <text x="272" y="145" font-family="DejaVu Sans, Noto Sans, Arial" font-size="92" font-weight="bold" fill="#FFFFFF">Swalekha</text>
  <text x="274" y="198" font-family="DejaVu Sans, Noto Sans, Arial" font-size="27" fill="#C9BEE8" letter-spacing="0.5">
    Personal Ledger &amp; Personal Finance
